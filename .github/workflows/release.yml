name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::package.json version ($PKG) does not match tag ($TAG)"
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Node 22 ships npm 10.x; OIDC trusted publishing needs npm 11.5+.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11

      - name: Check npm version
        id: npm-version
        run: |
          PKG=$(node -p "require('./package.json').version")
          if npm view "ankui@$PKG" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "ankui@$PKG is already published; skipping npm publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # --provenance auto-enables when the source repo is public.
      # npm refuses to publish provenance bundles for private repos
      # (the Sigstore attestation must be independently verifiable),
      # so we skip the flag while ankui is private and pick it up the
      # moment the repo flips to public — no manual workflow edit needed.
      - name: Publish to npm
        if: steps.npm-version.outputs.published != 'true'
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$IS_PRIVATE" = "true" ]; then
            echo "Source repo is private — publishing without --provenance"
            npm publish --access public
          else
            echo "Source repo is public — publishing with --provenance"
            npm publish --provenance --access public
          fi
